<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    /* Light Mode Colors */
    .stroke-primary { stroke: #1D4ED8; fill: none; }
    .stroke-secondary { stroke: #3B82F6; fill: none; }
    .stroke-accent { stroke: #60A5FA; fill: none; }
    .fill-primary { fill: #1D4ED8; }
    .fill-secondary { fill: #3B82F6; }
    .fill-accent { fill: #60A5FA; }

    /* Dark Mode Colors */
    @media (prefers-color-scheme: dark) {
      .stroke-primary { stroke: #93C5FD; }
      .stroke-secondary { stroke: #BFDBFE; }
      .stroke-accent { stroke: #DBEAFE; }
      .fill-primary { fill: #93C5FD; }
      .fill-secondary { fill: #BFDBFE; }
      .fill-accent { fill: #DBEAFE; }
    }
  </style>
  <g transform="translate(0, -2)">
<!--Main Pen Nib Body-->
    <path class="stroke-primary" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" d="M50 15 L30 40 L30 65 C30 80, 45 90, 50 90 C55 90, 70 80, 70 65 L70 40 L50 15 Z"/>
<!--Integrated 'S' Curve inside Nib-->
    <path class="stroke-primary" stroke-width="4.5" stroke-linecap="round" d="M50 32 C34 47, 66 61, 50 76"/>
<!--Top Right Trail / Digital Node-->
    <path class="stroke-secondary" stroke-width="3.5" stroke-linecap="round" d="M76 35 L90 24"/>
    <circle class="fill-secondary" cx="94" cy="21" r="3.5"/>
<!--Lower Right Accent Trail-->
    <path class="stroke-accent" stroke-width="3" stroke-linecap="round" d="M82 50 L95 40"/>
    <circle class="fill-accent" cx="98" cy="38" r="2.5"/>
<!--Bottom Left Connection Point-->
    <path class="stroke-secondary" stroke-width="3.5" stroke-linecap="round" d="M24 75 L11 85"/>
    <circle class="fill-secondary" cx="7" cy="88" r="4"/>
<!--Central Nib Dot-->
    <circle class="fill-primary" cx="50" cy="54" r="3"/>
  </g>
</svg>
