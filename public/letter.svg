<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 517">
  <style>
    :root {
      --canvas-bg: var(--card, #ffffff);
      --canvas-border: var(--border, #e4e4e7);
      --text-foreground: var(--card-foreground, #18181b);
      --text-muted: var(--muted-foreground, #71717a);
      --primary: #1D4ED8;
      --secondary: #3B82F6;
    }

    .canvas-bg { fill: var(--canvas-bg); }
    .stroke-border { stroke: var(--canvas-border); }
    .text-foreground { fill: var(--text-foreground); }
    .text-muted { fill: var(--text-muted); }
    .primary { fill: var(--primary); }
    .secondary { fill: var(--secondary); }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas-bg: var(--card, #202024);
        --canvas-border: var(--border, rgba(255, 255, 255, 0.1));
        --text-foreground: var(--card-foreground, #fafafa);
        --text-muted: var(--muted-foreground, #a1a1aa);
        --primary: #93C5FD;
        --secondary: #BFDBFE;
      }
    }

    :where(.dark, .dark *) {
      --canvas-bg: var(--card, #202024);
      --canvas-border: var(--border, rgba(255, 255, 255, 0.1));
      --text-foreground: var(--card-foreground, #fafafa);
      --text-muted: var(--muted-foreground, #a1a1aa);
      --primary: #93C5FD;
      --secondary: #BFDBFE;
    }
  </style>
  <rect x="0.5" y="0.5" width="399" height="516" rx="2" class="canvas-bg stroke-border" stroke-width="1"/>
  <!--Header-->
  <text x="40" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" class="primary">Your Band</text>
  <text x="40" y="60" font-family="Arial, sans-serif" font-size="11" class="secondary">September 24, 20XX</text>
  <!--Greeting-->
  <text x="40" y="100" font-family="Arial, sans-serif" font-size="22" class="text-foreground">Hello fan,</text>
  <!--Opening-->
  <text x="40" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" class="text-foreground">First, a big thank you!</text>
  <!--Body Paragraphs - Shorter sentences-->
  <text x="40" y="180" font-family="Arial, sans-serif" font-size="11" class="text-muted">
    Thanks for being such an amazing supporter of our music.
  </text>
  <text x="40" y="210" font-family="Arial, sans-serif" font-size="11" class="text-muted">
    We&apos;re excited to announce our new album is coming soon.
  </text>
  <text x="40" y="240" font-family="Arial, sans-serif" font-size="11" class="text-muted">
    You&apos;ll be the first to hear our latest singles.
  </text>
  <text x="40" y="280" font-family="Arial, sans-serif" font-size="11" class="text-muted">
    We&apos;re planning something special for our loyal fans.
  </text>
  <text x="40" y="310" font-family="Arial, sans-serif" font-size="11" class="text-muted">
    Stay tuned for exclusive content and updates.
  </text>
  <text x="40" y="340" font-family="Arial, sans-serif" font-size="11" class="text-muted">
    Can&apos;t wait to see you at our next show.
  </text>
  <!--Closing-->
  <text x="40" y="400" font-family="Arial, sans-serif" font-size="11" class="text-foreground">Lots of love,</text>
  <!--Signature-->
  <text x="40" y="440" font-family="Arial, sans-serif" font-size="11" font-weight="bold" class="primary">Your Name</text>
</svg>
