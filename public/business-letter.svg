<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 517">
  <style>
    :root {
      --canvas-bg: var(--card, #ffffff);
      --canvas-border: var(--border, #e4e4e7);
      --text-foreground: var(--card-foreground, #18181b);
      --text-muted: var(--muted-foreground, #71717a);
      --bg-muted: var(--muted, #f4f4f5);
      --primary: #1D4ED8;
      --secondary: #3B82F6;
    }

    .canvas-bg { fill: var(--canvas-bg); }
    .stroke-border { stroke: var(--canvas-border); }
    .text-foreground { fill: var(--text-foreground); }
    .text-muted { fill: var(--text-muted); }
    .bg-muted { fill: var(--bg-muted); }
    .primary { fill: var(--primary); }
    .secondary { fill: var(--secondary); }
    .stroke-primary { stroke: var(--primary); }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas-bg: var(--card, #202024);
        --canvas-border: var(--border, rgba(255, 255, 255, 0.1));
        --text-foreground: var(--card-foreground, #fafafa);
        --text-muted: var(--muted-foreground, #a1a1aa);
        --bg-muted: var(--muted, #2e2e34);
        --primary: #93C5FD;
        --secondary: #BFDBFE;
      }
    }

    :where(.dark, .dark *) {
      --canvas-bg: var(--card, #202024);
      --canvas-border: var(--border, rgba(255, 255, 255, 0.1));
      --text-foreground: var(--card-foreground, #fafafa);
      --text-muted: var(--muted-foreground, #a1a1aa);
      --bg-muted: var(--muted, #2e2e34);
      --primary: #93C5FD;
      --secondary: #BFDBFE;
    }
  </style>
  <rect x="0.5" y="0.5" width="399" height="516" rx="2" class="canvas-bg stroke-border" stroke-width="1"/>
  <!--Header with modern styling-->
  <text x="40" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" class="primary">YOUR COMPANY</text>
  <line x1="40" y1="45" x2="360" y2="45" class="stroke-primary" stroke-width="1" opacity="0.4"/>
  <!--Contact Information with icons represented by small squares-->
  <rect x="40" y="60" width="8" height="8" class="secondary" opacity="0.8" rx="1"/>
  <text x="55" y="68" font-family="Arial, sans-serif" font-size="10" class="text-muted">123 YOUR STREET</text>
  <rect x="40" y="75" width="8" height="8" class="secondary" opacity="0.8" rx="1"/>
  <text x="55" y="83" font-family="Arial, sans-serif" font-size="10" class="text-muted">YOUR CITY, ST 12345</text>
  <rect x="40" y="90" width="8" height="8" class="secondary" opacity="0.8" rx="1"/>
  <text x="55" y="98" font-family="Arial, sans-serif" font-size="10" class="text-muted">(123) 456-7890</text>
  <rect x="40" y="105" width="8" height="8" class="secondary" opacity="0.8" rx="1"/>
  <text x="55" y="113" font-family="Arial, sans-serif" font-size="10" class="text-muted">MYEMAIL@EXAMPLE.COM</text>
  <!--Date with subtle background-->
  <rect x="40" y="135" width="100" height="20" class="bg-muted" rx="3"/>
  <text x="48" y="148" font-family="Arial, sans-serif" font-size="10" class="text-foreground">September 24, 20XX</text>
  <!--Greeting-->
  <text x="40" y="185" font-family="Arial, sans-serif" font-size="10" font-weight="bold" class="text-foreground">Dear Ms. Reader,</text>
  <!--Body Paragraphs with left border-->
  <rect x="40" y="205" width="2" height="150" class="primary" opacity="0.5"/>
  <text x="50" y="220" font-family="Arial, sans-serif" font-size="10" class="text-foreground">
    Thank you for your interest in our services.
  </text>
  <text x="50" y="245" font-family="Arial, sans-serif" font-size="10" class="text-foreground">
    We are pleased to provide you with our latest product offerings.
  </text>
  <text x="50" y="270" font-family="Arial, sans-serif" font-size="10" class="text-foreground">
    Our team has extensive experience in business solutions.
  </text>
  <text x="50" y="295" font-family="Arial, sans-serif" font-size="10" class="text-foreground">
    We look forward to discussing this opportunity further.
  </text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="10" class="text-foreground">
    Please contact us if you have any questions.
  </text>
  <!--Closing with subtle styling-->
  <text x="40" y="380" font-family="Arial, sans-serif" font-size="10" class="text-foreground">Sincerely,</text>
  <!--Signature area with background-->
  <rect x="40" y="420" width="100" height="30" class="bg-muted" rx="3"/>
  <text x="48" y="440" font-family="Arial, sans-serif" font-size="10" class="primary" font-weight="bold">YOUR NAME</text>
  <!--Decorative Bottom Element-->
  <rect x="40" y="470" width="320" height="1" class="primary" opacity="0.2"/>
</svg>
