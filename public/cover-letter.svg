<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 517">
  <style>
    :root {
      --canvas-bg: var(--card, #ffffff);
      --canvas-border: var(--border, #e4e4e7);
      --text-foreground: var(--card-foreground, #18181b);
      --text-muted: var(--muted-foreground, #71717a);
      --primary: #1D4ED8;
    }

    .canvas-bg { fill: var(--canvas-bg); }
    .stroke-border { stroke: var(--canvas-border); }
    .text-foreground { fill: var(--text-foreground); }
    .text-muted { fill: var(--text-muted); }
    .primary { fill: var(--primary); }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas-bg: var(--card, #202024);
        --canvas-border: var(--border, rgba(255, 255, 255, 0.1));
        --text-foreground: var(--card-foreground, #fafafa);
        --text-muted: var(--muted-foreground, #a1a1aa);
        --primary: #93C5FD;
      }
    }

    :where(.dark, .dark *) {
      --canvas-bg: var(--card, #202024);
      --canvas-border: var(--border, rgba(255, 255, 255, 0.1));
      --text-foreground: var(--card-foreground, #fafafa);
      --text-muted: var(--muted-foreground, #a1a1aa);
      --primary: #93C5FD;
    }
  </style>
  <rect x="0.5" y="0.5" width="399" height="516" rx="2" class="canvas-bg stroke-border" stroke-width="1"/>
  <!--Header with contact info-->
  <text x="40" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" class="primary">Your Name</text>
  <text x="40" y="60" font-family="Arial, sans-serif" font-size="11" class="text-muted">123 Your Street</text>
  <text x="40" y="75" font-family="Arial, sans-serif" font-size="11" class="text-muted">Your City, ST 12345</text>
  <text x="40" y="90" font-family="Arial, sans-serif" font-size="11" class="text-muted">phone: (555) 555-5555</text>
  <text x="40" y="105" font-family="Arial, sans-serif" font-size="11" class="text-muted">email: your.email@example.com</text>
  <!--Date-->
  <text x="40" y="140" font-family="Arial, sans-serif" font-size="11" class="text-muted">September 24, 2024</text>
  <!--Recipient Info-->
  <text x="40" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" class="text-foreground">Hiring Manager</text>
  <text x="40" y="195" font-family="Arial, sans-serif" font-size="11" class="text-muted">Company Name</text>
  <text x="40" y="210" font-family="Arial, sans-serif" font-size="11" class="text-muted">123 Company Street</text>
  <text x="40" y="225" font-family="Arial, sans-serif" font-size="11" class="text-muted">Company City, ST 12345</text>
  <!--Greeting-->
  <text x="40" y="265" font-family="Arial, sans-serif" font-size="11" class="text-foreground">Dear Hiring Manager,</text>
  <!--Letter Body Placeholder Lines-->
  <line x1="40" y1="300" x2="360" y2="300" class="stroke-border" stroke-width="1.5"/>
  <line x1="40" y1="320" x2="360" y2="320" class="stroke-border" stroke-width="1.5"/>
  <line x1="40" y1="340" x2="360" y2="340" class="stroke-border" stroke-width="1.5"/>
  <line x1="40" y1="360" x2="360" y2="360" class="stroke-border" stroke-width="1.5"/>
  <line x1="40" y1="380" x2="360" y2="380" class="stroke-border" stroke-width="1.5"/>
  <!--Closing-->
  <text x="40" y="440" font-family="Arial, sans-serif" font-size="11" class="text-foreground">Sincerely,</text>
  <text x="40" y="480" font-family="Arial, sans-serif" font-size="11" font-weight="bold" class="text-foreground">Your Name</text>
</svg>
