<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 517">
  <style>
    :root {
      --canvas-bg: var(--card, #ffffff);
      --canvas-border: var(--border, #e4e4e7);
      --text-foreground: var(--card-foreground, #18181b);
      --text-muted: var(--muted-foreground, #71717a);
      --primary: #1D4ED8;
    }

    .canvas-bg { fill: var(--canvas-bg); }
    .stroke-border { stroke: var(--canvas-border); }
    .text-foreground { fill: var(--text-foreground); }
    .text-muted { fill: var(--text-muted); }
    .primary { fill: var(--primary); }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas-bg: var(--card, #202024);
        --canvas-border: var(--border, rgba(255, 255, 255, 0.1));
        --text-foreground: var(--card-foreground, #fafafa);
        --text-muted: var(--muted-foreground, #a1a1aa);
        --primary: #93C5FD;
      }
    }

    :where(.dark, .dark *) {
      --canvas-bg: var(--card, #202024);
      --canvas-border: var(--border, rgba(255, 255, 255, 0.1));
      --text-foreground: var(--card-foreground, #fafafa);
      --text-muted: var(--muted-foreground, #a1a1aa);
      --primary: #93C5FD;
    }
  </style>
  <rect x="0.5" y="0.5" width="399" height="516" rx="2" class="canvas-bg stroke-border" stroke-width="1"/>
  <!--Header Section-->
  <text x="40" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" class="primary">Hello,</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" class="text-foreground">I&apos;m Your Name</text>
  <!--Contact Info-->
  <text x="40" y="100" font-family="Arial, sans-serif" font-size="11" class="text-muted">123 YOUR STREET</text>
  <text x="40" y="115" font-family="Arial, sans-serif" font-size="11" class="text-muted">YOUR CITY, ST 12345</text>
  <text x="40" y="130" font-family="Arial, sans-serif" font-size="11" class="text-muted">TEL: 555.555.5555</text>
  <text x="40" y="145" font-family="Arial, sans-serif" font-size="11" class="text-muted">YOU.REPLY@EXAMPLE.COM</text>
  <!--Skills Section-->
  <text x="40" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" class="primary">Skills</text>
  <text x="40" y="210" font-family="Arial, sans-serif" font-size="11" class="text-foreground">Skills description here. Core competencies and key abilities.</text>
  <!--Experience Section-->
  <text x="40" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" class="primary">Experience</text>
  <!--Job Entries-->
  <text x="40" y="280" font-family="Arial, sans-serif" font-size="10" class="text-muted">MONTH 20XX – MONTH 20YY</text>
  <text x="40" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="bold" class="text-foreground">Company Name, Location</text>
  <text x="195" y="295" font-family="Arial, sans-serif" font-size="12" class="text-muted"> — Job Title</text>
  <!--Job Details-->
  <circle cx="50" cy="315" r="2" class="primary"/>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="11" class="text-foreground">Key responsibility or achievement</text>
  <!--Education Section-->
  <text x="40" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="bold" class="primary">Education</text>
  <text x="40" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="bold" class="text-foreground">College Name, Location — Degree</text>
  <!--Awards Section-->
  <text x="40" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" class="primary">Awards</text>
  <text x="40" y="500" font-family="Arial, sans-serif" font-size="11" class="text-foreground">Notable achievement or recognition.</text>
</svg>
